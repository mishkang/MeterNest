[package]
name = "meternest"
version = "0.8.9"
description = "MeterNest · Codex 与 WorkBuddy 菜单栏额度仪表"
authors = ["MeterNest"]
license = "UNLICENSED"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
png = "0.17"
futures = "0.3"
url = "2"
libc = "0.2"
dirs = "5"
once_cell = "1"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSString",
  "NSLocale",
  "NSArray",
  "NSDictionary",
  "NSDate",
  "NSThread",
  "NSValue",
  "NSEnumerator",
  "NSNotification",
  "NSAttributedString",
  "NSData",
  "NSGeometry",
] }
objc2-app-kit = { version = "0.3", features = [
  "NSStatusBar",
  "NSStatusItem",
  "NSStatusBarButton",
  "NSWindow",
  "NSPanel",
  "NSColor",
  "NSApplication",
  "NSWorkspace",
  "NSEvent",
  "NSImage",
  "NSBitmapImageRep",
  "NSGraphics",
  "NSScreen",
  "NSView",
  "NSFont",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
